name: Verify and publish WebMicrophone

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webmicrophone-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-build:
    name: Test audio and build the static site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Run deterministic unit and DSP tests
        run: npm test
      - name: Install the matching Chromium revision
        run: npx playwright install --with-deps chromium
      - name: Run browser audio and UI checks
        run: npm run test:e2e
      - name: Build the GitHub Pages artifact
        run: npm run build
      - name: Verify microphone failures and recording recovery in the Pages build
        env:
          WEBMIC_TEST_BUILD: '1'
        run: npx playwright test tests/e2e/mic-failures.spec.js tests/e2e/recording-recovery.spec.js
      - name: Preserve browser test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the verified Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish the verified site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The repository's Pages source must already be GitHub Actions. This
      # intentionally does not enable or change Pages settings automatically.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
